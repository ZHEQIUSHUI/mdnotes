name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        run: |
          pip install -q fastapi==0.115.6 uvicorn==0.32.1 python-multipart==0.0.20 httpx
          mkdir -p /tmp/notes/demo && printf '# Hello\n\nhi\n' > /tmp/notes/demo/index.md
          DATA_DIR=/tmp/notes AUTH_MODE=edit AUTH_PASSWORD=pw python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          c = TestClient(app.app)
          assert c.get("/").status_code == 200
          assert [a["title"] for a in c.get("/api/articles").json()] == ["Hello"]
          assert c.post("/api/folder", json={"path": "x"}).status_code == 401
          assert c.post("/api/login", json={"password": "pw"}).status_code == 200
          assert c.post("/api/folder", json={"path": "x"}).status_code == 200
          c2 = TestClient(app.app)  # comments need no login
          r = c2.post("/api/comments", json={"path": "demo/index.md", "body": "nice",
                                             "anchor": {"exact": "hi", "prefix": "", "suffix": ""}}).json()
          assert c2.get("/api/comments", params={"path": "demo/index.md"}).json()[0]["anchor"]["exact"] == "hi"
          assert c2.delete("/api/comments", params={"path": "demo/index.md", "id": r["id"], "key": "bad"}).status_code == 401
          assert c2.delete("/api/comments", params={"path": "demo/index.md", "id": r["id"], "key": r["key"]}).status_code == 200
          PY

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
